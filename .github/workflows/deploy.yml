name: Build and deploy wiki

# This repo IS the wiki/ folder, so the game's 700 MB of assets are never in it.
# The extractor runs locally, where the game files live; the repo carries the
# generated data/*.json and site/public/ (~13 MB) and CI builds the site.
#
# After changing anything: run `python build.py` locally, commit the changed
# JSON and sprites, push. This workflow does the rest.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >=22.12; this matches the local build.
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}/
          # Repository variable NOINDEX=1 keeps the site out of search engines
          # while it is in beta. Settings -> Secrets and variables -> Actions.
          NOINDEX: ${{ vars.NOINDEX }}
        run: |
          npm ci
          npm run build

      - name: Check links resolve and respect the base path
        run: python3 check_links.py site/dist --base "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
